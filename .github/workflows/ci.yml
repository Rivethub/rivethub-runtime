name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"

jobs:
  gate:
    name: Gate (cargo xtask check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-10-11
          components: rustc-dev, llvm-tools-preview
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Dylint (prebuilt, matches lints/ dylint_linting)
        env:
          DYLINT_VERSION: 6.1.1
        run: |
          base="https://github.com/trailofbits/dylint/releases/download/v${DYLINT_VERSION}"
          for pair in \
            cargo-dylint:6a4a9c163dd12093347b64d83e4202d3421c60ecfc4a5a9a10b3654ae742cec4 \
            dylint-link:e570e1d6ffe6528960521f81e719b22a3964e1971688a012ad8f50189594356d; do
            tool="${pair%%:*}"
            archive="${tool}-x86_64-unknown-linux-gnu-v${DYLINT_VERSION}.tar.gz"
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
            echo "${pair#*:}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
            tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
            install -m 755 "${RUNNER_TEMP}/${archive%.tar.gz}/${tool}" "${CARGO_HOME:-$HOME/.cargo}/bin/${tool}"
          done
          cargo dylint --version
          clippy="${RUNNER_TEMP}/rust-clippy.git"
          git clone --quiet --bare https://github.com/rust-lang/rust-clippy "${clippy}"
          git -C "${clippy}" branch master main
          git -C "${clippy}" symbolic-ref HEAD refs/heads/master
          git config --global url."${clippy}".insteadOf https://github.com/rust-lang/rust-clippy
      - name: cargo xtask check
        run: cargo xtask check --locked --no-nextest-list

  commits:
    name: Commits (no AI attribution, Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: No AI attribution
        run: cargo xtask commits "origin/${{ github.base_ref }}..HEAD"
      - name: Conventional Commits
        uses: crate-ci/committed@02af07ed1d11ad69a96ab75f08c9831a4e2c00da # v1.1.12
        with:
          args: --no-wip
          commits: "origin/${{ github.base_ref }}..HEAD"

  macos:
    name: macOS (rh build, cli tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest
      - name: Postgres with pgvector
        run: |
          brew install postgresql@17 pgvector
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@17
          for _ in $(seq 1 30); do "$(brew --prefix postgresql@17)/bin/pg_isready" -h 127.0.0.1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Postgres without disk syncing
        run: psql "$DATABASE_URL" -c "alter system set fsync=off" -c "alter system set synchronous_commit=off" -c "alter system set full_page_writes=off" -c "select pg_reload_conf()"
      - name: Build rh
        run: cargo build --locked -p rivethub --bin rh
      - name: cli tests
        run: cargo nextest run --locked -p cli --all-features --profile macos --no-fail-fast
        env:
          TMPDIR: ${{ runner.temp }}

  rust:
    name: Tests (coverage) and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny@0.20.2
      - name: sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Postgres without disk syncing
        run: psql "$DATABASE_URL" -c "alter system set fsync=off" -c "alter system set synchronous_commit=off" -c "alter system set full_page_writes=off" -c "select pg_reload_conf()"
      - name: Tests under the coverage floor
        run: cargo llvm-cov nextest --workspace --all-features --locked --fail-under-lines "$(cat coverage-floor.txt)" --summary-only
      - name: Query data is current
        run: |
          cargo sqlx migrate run --source crates/migrate/migrations
          cargo sqlx prepare --workspace --check
        env:
          SQLX_OFFLINE: "false"
      - name: Build
        run: cargo build --workspace --locked
