[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["lints"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.7.0"
repository = "https://github.com/philbert440/rivethub-runtime"
rust-version = "1.99"

[workspace.metadata.dylint]
libraries = [{ path = "lints" }]

[workspace.dependencies]
agent-client-protocol = "3.3"
agent-loop = { path = "crates/agent-loop", version = "0.7.0" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
capture = { path = "crates/capture", version = "0.7.0" }
cargo_metadata = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
cli = { path = "crates/cli", version = "0.7.0" }
config = { path = "crates/config", version = "0.7.0" }
croner = "4"
eventsource-stream = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
gateway = { path = "crates/gateway", version = "0.7.0" }
getrandom = "0.4"
governor = { version = "0.10.4", default-features = false, features = ["std", "quanta"] }
harness-acp = { path = "crates/harness-acp", version = "0.7.0" }
hex = "0.4"
http-body = { version = "1", default-features = false }
httparse = "1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
kernel = { path = "crates/kernel", version = "0.7.0" }
landlock = "0.4.7"
libc = "0.2"
libtest-mimic = "0.8"
mcp = { path = "crates/mcp", version = "0.7.0" }
memory-postgres = { path = "crates/memory-postgres", version = "0.7.0" }
memory-sqlite = { path = "crates/memory-sqlite", version = "0.7.0" }
migrate = { path = "crates/migrate", version = "0.7.0" }
nix = { version = "0.30", features = ["process", "signal", "fs", "user"] }
num-bigint = "0.4"
parking_lot = "0.12"
percent-encoding = "2"
pgvector = { version = "0.4", features = ["sqlx"] }
pki = { path = "crates/pki", version = "0.7.0" }
portable-pty = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
providers = { path = "crates/providers", version = "0.7.0" }
ra-ap-rustc_lexer = "0.177"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1"
regress = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.5", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1"
schemars = { version = "1", features = ["chrono04", "url2"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
serde_with = { version = "3", default-features = false, features = ["macros", "schemars_1"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
shlex = "2"
similar-asserts = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate"] }
stepca = { path = "crates/stepca", version = "0.7.0" }
strum = { version = "0.27", features = ["derive"] }
subtle = "2"
syn = { version = "2", features = ["full", "visit"] }
tar = { version = "0.4", default-features = false }

tempfile = "3"
terminal = { path = "crates/terminal", version = "0.7.0" }
testkit = { path = "crates/testkit", version = "0.7.0" }
thiserror = "2"
time = "0.3"
tokio = { version = "1" }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
values = { path = "crates/values", version = "0.7.0" }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
wire = { path = "crates/wire", version = "0.7.0" }
workers = { path = "crates/workers", version = "0.7.0" }
x509-parser = { version = "0.18", features = ["verify-aws"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(dylint_lib, values(any()))'] }
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
option_option = "deny"
derivable_impls = "deny"
mem_forget = "deny"
indexing_slicing = "warn"
wildcard_enum_match_arm = "warn"
large_futures = "warn"
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
future_not_send = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
