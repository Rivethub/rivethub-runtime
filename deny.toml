[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained and no upgrade clears it; it is used across the workspace, so replacing it with jiff or time is its own change" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with chrono; it goes when chrono does" },
]

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "OpenSSL", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "sqlx", wrappers = ["memory-postgres", "memory-sqlite", "migrate", "testkit", "rivethub", "cli", "pgvector"] },
  { crate = "pgvector", wrappers = ["memory-postgres"] },
  { crate = "rusqlite", wrappers = ["memory-postgres", "memory-sqlite", "migrate", "testkit", "rivethub", "cli", "capture"] },
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
  { crate = "ring" },
  { crate = "anyhow", wrappers = ["agent-client-protocol", "agent-client-protocol-schema"] },
  { crate = "async-std" },
  { crate = "tmux_interface" },

  { crate = "values", wrappers = ["wire", "kernel"] },
  { crate = "wire", wrappers = ["config", "testkit", "migrate", "memory-postgres", "memory-sqlite", "providers", "harness-acp", "mcp", "capture", "gateway", "workers", "cli", "rivethub"] },
  { crate = "config", wrappers = ["kernel", "testkit", "migrate", "memory-postgres", "memory-sqlite", "providers", "harness-acp", "mcp", "capture", "gateway", "workers", "cli", "rivethub"] },
  { crate = "kernel", wrappers = ["testkit", "memory-postgres", "memory-sqlite", "providers", "harness-acp", "mcp", "capture", "gateway", "workers", "cli", "rivethub"] },
  { crate = "testkit", wrappers = ["wire", "config", "kernel", "migrate", "memory-postgres", "memory-sqlite", "providers", "harness-acp", "mcp", "capture", "gateway", "workers", "cli", "rivethub"] },
  { crate = "memory-postgres", wrappers = ["migrate", "cli", "rivethub"] },
  { crate = "memory-sqlite", wrappers = ["migrate", "cli", "rivethub"] },
  { crate = "providers", wrappers = ["cli", "rivethub"] },
  { crate = "harness-acp", wrappers = ["cli", "rivethub"] },
  { crate = "mcp", wrappers = ["cli", "rivethub"] },
  { crate = "capture", wrappers = ["cli", "rivethub"] },
  { crate = "gateway", wrappers = ["cli", "rivethub"] },
  { crate = "workers", wrappers = ["cli", "rivethub"] },
  { crate = "cli", wrappers = ["rivethub"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/launchbadge/sqlx"]
