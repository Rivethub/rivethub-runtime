extensions = ["rs", "toml"]
paths = [
  ".gitattributes",
  ".cargo/config.toml",
  ".github/CODEOWNERS",
  ".github/codeql/codeql-config.yml",
  ".github/dependabot.yml",
  ".github/release.yml",
  ".github/scripts/sign-release.mjs",
  ".gitignore",
  "Cargo.lock",
  "contract/accepted.schema.json",
  "contract/sent.schema.json",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "coverage-floor.txt",
  "crates/cli/tests/browser/login-flow.mjs",
  "crates/gateway/src/routes/login.html",
  "crates/gateway/src/routes/login.js",
  "lints/Cargo.lock",
]
globs = [
  ".github/workflows/*.yml",
  ".sqlx/*.json",
  "crates/*/migrations/*.sql",
  "crates/*/tests/golden/**/*.json",
  "crates/*/tests/golden/**/*.jsonl",
  "crates/*/tests/golden/**/*.txt",
  "crates/*/tests/fixtures/**/*.json",
  "crates/*/tests/fixtures/**/*.jsonl",
  "crates/*/tests/fixtures/**/*.txt",
  "crates/migrate/src/schema/*.sql",
  "crates/testkit/tests/fixtures/memory-sqlite/*.sqlite",
  "lints/examples/*.stderr",
  "lints/ui/**/*.stderr",
  "xtask/data/*.json",
]
deny = [
  "**/rr-*-NOTES.md",
]
